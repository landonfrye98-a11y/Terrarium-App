name: Build Android APK

on:
  push:
    paths:
      - 'www/**'
      - 'android/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Glasswild.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Glasswild-${{ github.run_number }}
          path: Glasswild.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Glasswild build ${{ github.run_number }}
          make_latest: true
          files: Glasswild.apk
          body: |
            Glasswild for Android, built from `${{ github.ref_name }}` @ ${{ github.sha }}.

            **Install:** download `Glasswild.apk` on your phone and open it. Android will ask you to allow installs from your browser the first time.
            Every build is signed with the same key, so a newer APK installs over the old one and your terrarium is kept.
